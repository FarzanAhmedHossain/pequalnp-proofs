# Cloud runs on this fork (FarzanAhmedHossain/pequalnp-proofs), never on upstream.
# A push to a branch named cloud/<name> starts it. The branch carries cloud/job.env:
#
#   LEAN_CHECK="lean/PEqualNP/Outside/L_meta_1234.lean ..."
#       proof files to run through the desk checker (tools/check-lean.mjs), on the same
#       machine limits as upstream's authoritative check (2 cores, 6.5 GB, 20 minutes).
#       An entry "path:GAP-ID:kind" names the step and kind (check|refute|reduce) instead of
#       reading them from the file name; R_ reduction files need that form.
#   LEAN_COMPILE="lean/PEqualNP/Outside/Scratch.lean ..."
#       files to compile with `lake env lean` after building PEqualNP.Defs (no checker).
#   SHARDS=8          if > 0, run `bash cloud/run.sh` in that many parallel jobs with
#                     SHARD (0-based), SHARDS, CADICAL (the toolchain's cadical) and OUT set.
#   SHARD_MINUTES=340 time limit for each shard.
#   SUBMIT="L-meta-1234"
#       after the checker ACCEPTS lean/PEqualNP/Outside/L_meta_1234.lean (or SUBMIT_FILE, e.g. an
#       R_meta_1234_7.lean reduction), open the PR on open-goat/pequalnp-proofs from branch L-meta-1234
#       of this fork = the upstream commit the check ran on plus that one file. Uses the PR_PAT secret
#       (a token of this fork's owner); prints PR_OPENED <url>, PR_SKIPPED <why> or PR_FAILED <why>.
#       SUBMIT_DRY=1 does everything except opening the PR (a throwaway branch, gh pr create --dry-run).
#
# Everything a job writes to out/ is uploaded as an artifact.
name: cloud-run

on:
  push:
    branches: ['cloud/**']

permissions:
  contents: read

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      lean: ${{ steps.p.outputs.lean }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud
      - id: p
        run: |
          set -eu
          . cloud/job.env
          if [ -n "${LEAN_CHECK:-}${LEAN_COMPILE:-}" ]; then echo "lean=yes" >> "$GITHUB_OUTPUT"; else echo "lean=no" >> "$GITHUB_OUTPUT"; fi
          n=${SHARDS:-0}
          echo "shards=$(python3 -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$n")" >> "$GITHUB_OUTPUT"

  lean:
    needs: plan
    if: needs.plan.outputs.lean == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2              # HEAD^ is the upstream commit the run was cut from
          persist-credentials: false  # no token left in .git while the proof builds

      - name: Install the pinned Lean toolchain
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"

      - name: Fetch the prebuilt Mathlib
        working-directory: lean
        run: lake exe cache get

      - name: Swap space
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          d=$(df -m --output=avail,target / /mnt 2>/dev/null | awk 'NR>1' | sort -rn | awk 'NR==1{print $2}')
          mb=$(( $(df -m --output=avail "$d" | awk 'NR==2{print $1}') - 6144 ))
          [ "$mb" -le 12288 ] || mb=12288
          if [ "$mb" -ge 1024 ]; then
            f="${d%/}/pnp-swap"
            sudo fallocate -l "${mb}M" "$f" && sudo chmod 600 "$f"
            sudo mkswap -q "$f" && sudo swapon "$f"
          fi
          free -m

      - name: Check and compile
        run: |
          set -u +e   # Actions runs steps with bash -e; a failing check must not end the loop
          . cloud/job.env
          mkdir -p out
          rc=0
          if [ -n "${LEAN_CHECK:-}" ]; then
            curl -sSf --proto '=https' -o out/gaps.json https://data.pequalnp.com/data/desk/gaps.json
          fi
          for entry in ${LEAN_CHECK:-}; do
            f=${entry%%:*}; b=$(basename "$f" .lean); d="$PWD/out/$b"; mkdir -p "$d"
            case "$entry" in
              *:*:*) rest=${entry#*:}; gap=${rest%%:*}; kind=${rest#*:}
                     node .github/scripts/outside-guard.mjs gap out/gaps.json "$gap" "$f" "$d" "$kind" > "$d/guard.log" 2>&1 ;;
              *)     kind=check
                     node .github/scripts/outside-guard.mjs gap-of-file out/gaps.json "$f" "$d" > "$d/guard.log" 2>&1 ;;
            esac
            if [ $? -ne 0 ]; then echo "$b: the guard refused (see out/$b/guard.log)" | tee -a out/summary.txt; cat "$d/guard.log"; rc=1; continue; fi
            node .github/scripts/outside-guard.mjs imports "$f" "$d/imports.json" "$f" "$kind" >> "$d/guard.log" 2>&1 \
              || { echo "$b: import rule refused (see out/$b/guard.log)" | tee -a out/summary.txt; cat "$d/guard.log"; rc=1; continue; }
            # The authoritative machine: two cores, at most 6.5 GB, 20 minutes.
            cap=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) - 1572864 ))
            [ "$cap" -le 6815744 ] || cap=6815744
            start=$(date +%s)
            sudo systemd-run --quiet --scope --collect -p MemoryMax="${cap}K" --uid="$(id -u)" --gid="$(id -g)" \
              env HOME="$HOME" PATH="$PATH" taskset -c 0,1 timeout -k 30 1200 \
              node tools/check-lean.mjs "$f" "$d/statement.txt" "$kind" > "$d/check.out" 2> "$d/check.err"
            c=$?
            case "$c" in 124|137) echo "the checker was stopped after 20 minutes" >> "$d/check.err" ;; esac
            pkill -KILL -f "lean/.lake/build/bin/checklemma" || true
            echo "$b: checker exit $c ($(( $(date +%s) - start ))s; 0 = ACCEPTED, 1 = REJECTED, 3 = fault)" | tee -a out/summary.txt
            tail -n 40 "$d/check.err"; tail -n 60 "$d/check.out"
            [ "$c" -eq 0 ] || rc=1
          done
          if [ -n "${LEAN_COMPILE:-}" ]; then
            (cd lean && lake build PEqualNP.Defs) > out/defs-build.log 2>&1 || { echo "PEqualNP.Defs build failed" | tee -a out/summary.txt; tail -n 40 out/defs-build.log; rc=1; }
            for f in $LEAN_COMPILE; do
              b=$(basename "$f" .lean); start=$(date +%s)
              (cd lean && timeout -k 30 7200 lake env lean "${f#lean/}") > "out/$b.compile.log" 2>&1
              c=$?
              echo "$b: compile exit $c ($(( $(date +%s) - start ))s)" | tee -a out/summary.txt
              tail -n 80 "out/$b.compile.log"
              [ "$c" -eq 0 ] || rc=1
            done
          fi
          echo "=== summary"; cat out/summary.txt 2>/dev/null
          exit $rc

      # The token reaches this step only, after the proof's build has finished.
      - name: Open the PR on open-goat (SUBMIT, only after the checker accepted)
        if: always()
        env:
          PR_PAT: ${{ secrets.PR_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u +e
          . cloud/job.env
          [ -n "${SUBMIT:-}" ] || exit 0
          say() { echo "$*" | tee -a out/summary.txt; }
          id="$SUBMIT"; dry="${SUBMIT_DRY:-0}"
          printf '%s' "$id" | grep -Eqx 'L-[a-z]+-[0-9]+' || { say "PR_FAILED bad SUBMIT id"; exit 1; }
          f="${SUBMIT_FILE:-lean/PEqualNP/Outside/$(echo "$id" | tr - _).lean}"
          b=$(basename "$f" .lean)
          if ! grep -q "^$b: checker exit 0 " out/summary.txt 2>/dev/null; then
            # a dry run tests the PR path whatever the verdict (it publishes nothing)
            [ "$dry" = 1 ] || { say "PR_SKIPPED $b was not accepted by the checker"; exit 0; }
            say "PR_DRY note: $b was not accepted in this run; testing the PR path anyway"
          fi
          [ -n "$PR_PAT" ] || { say "PR_SKIPPED no PR_PAT secret on this fork"; exit 0; }
          export GH_TOKEN="$PR_PAT"
          who=$(gh api user --jq .login 2>/dev/null)
          [ "$who" = "$GITHUB_REPOSITORY_OWNER" ] || { say "PR_FAILED PR_PAT does not authenticate as $GITHUB_REPOSITORY_OWNER (got '${who:-nothing}')"; exit 1; }
          # Last-moment duplicate check: an open PR adding the same file, or a merged one on the step.
          same=$(gh pr list --repo open-goat/pequalnp-proofs --state open --limit 1000 --json number,files \
                   --jq "[.[] | select(any(.files[]?; .path == \"$f\")) | .number] | join(\",\")") \
            || { say "PR_FAILED could not list open PRs"; exit 1; }
          merged=$(gh pr list --repo open-goat/pequalnp-proofs --state merged --search "$id" --json number,title \
                   --jq "[.[] | select(.title | test(\"(^|[^0-9])$id(\$|[^0-9])\")) | .number] | join(\",\")")
          if [ -n "$same$merged" ] && [ "$dry" != 1 ]; then
            say "PR_SKIPPED $id already has a PR (open with the same file: ${same:-none}; merged: ${merged:-none})"; exit 0
          fi
          # The PR commit: the upstream commit the check ran on, plus the one checked file.
          base=$(git rev-parse HEAD^)
          export GIT_INDEX_FILE="$RUNNER_TEMP/pr-index"
          git read-tree "$base"
          blob=$(git hash-object -w "$f")
          git update-index --add --cacheinfo "100644,$blob,$f"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          name="Farzan Ahmed Hossain"; mail="262016037+FarzanAhmedHossain@users.noreply.github.com"
          commit=$(printf '%s\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\n' "$id" | \
            GIT_AUTHOR_NAME="$name" GIT_AUTHOR_EMAIL="$mail" GIT_COMMITTER_NAME="$name" GIT_COMMITTER_EMAIL="$mail" \
            git commit-tree "$tree" -p "$base")
          branch="$id"; [ "$dry" = 1 ] && branch="pr-dry-run-$GITHUB_RUN_ID"
          remote="https://x-access-token:${PR_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f "$remote" "$commit:refs/heads/$branch" || { say "PR_FAILED push of branch $branch"; exit 1; }
          case "$b" in R_*) title="$id (reduction)" ;; *) title="$id" ;; esac
          body=$(printf 'Proof of %s: one file, `%s`. Before this PR, tools/check-lean.mjs accepted it on GitHub Actions under the authoritative limits (2 cores, 6.5 GB, 20 minutes): %s\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' "$id" "$f" "$RUN_URL")
          if [ "$dry" = 1 ]; then
            gh pr create --repo open-goat/pequalnp-proofs --base main --head "${GITHUB_REPOSITORY_OWNER}:$branch" \
              --title "$title" --body "$body" --dry-run; c=$?
            git push -q "$remote" --delete "$branch"
            [ "$c" = 0 ] && say "PR_DRY_OK token, push and PR creation all work (dry run; duplicates: ${same:-none}/${merged:-none})" \
                         || say "PR_FAILED gh pr create --dry-run exited $c"
            exit 0
          fi
          url=$(gh pr create --repo open-goat/pequalnp-proofs --base main --head "${GITHUB_REPOSITORY_OWNER}:$branch" \
                  --title "$title" --body "$body") || { say "PR_FAILED gh pr create"; exit 1; }
          say "PR_OPENED $url"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-out
          path: out/
          retention-days: 14

  shard:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Lean toolchain (for its cadical)
        run: |
          set -eu
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
          c=$(ls "$HOME"/.elan/toolchains/*/bin/cadical | head -1)
          echo "CADICAL=$c" >> "$GITHUB_ENV"
          "$c" --version

      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -u +e   # Actions runs steps with bash -e; a failing check must not end the loop
          . cloud/job.env
          mkdir -p out
          export SHARD SHARDS CADICAL OUT="$PWD/out"
          timeout -k 60 $(( ${SHARD_MINUTES:-340} * 60 )) bash cloud/run.sh > "out/shard-$SHARD.log" 2>&1
          c=$?
          echo "shard $SHARD exit $c" | tee -a "out/shard-$SHARD.log"
          tail -n 60 "out/shard-$SHARD.log"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 14
